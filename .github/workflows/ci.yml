name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR supersedes its running checks; main runs every merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run on the org's own ephemeral lane (vitrinka-kit-ci: one container per
# job, no Docker socket). This repo is public, so a pull request from a fork
# never reaches that runner: its jobs are skipped, and a maintainer pushes the
# branch here to test it.
jobs:
  test:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    runs-on: [self-hosted, vitrinka-kit-ci]
    steps:
      # A bridge runner cannot reach the VM's loopback Actions cache, so
      # setup-bun's cache talks to GitHub directly. The patched runner hands
      # GitHub's results endpoint only to JavaScript actions, as
      # ACTIONS_RESULTS_ORL; this step exports it before setup-bun needs it.
      - name: Runner network
        id: runner
        run: echo "network=${CI_JIT_RUNNER_NETWORK:-host}" >> "$GITHUB_OUTPUT"
      - name: GitHub results endpoint (bridge runner)
        if: steps.runner.outputs.network == 'bridge'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = process.env.ACTIONS_RESULTS_ORL
            if (!url) throw new Error('bridge runner: the patched runner exposed no ACTIONS_RESULTS_ORL')
            core.exportVariable('ACTIONS_RESULTS_URL', url)
      - uses: actions/checkout@v4
      # The lane image bakes bun 1.4.3; with it present this only verifies.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Build first: @vitrinka/expo consumes @vitrinka/redact through its
      # build output (main/types point at build/), so typecheck and tests
      # need the workspace built.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      # The extension's checked-in copy of the shared redaction engine must
      # match a fresh build — vendor drift would silently fork the semantics.
      - name: redaction vendor drift check
        run: |
          bun run --filter @vitrinka/redact build:vendor
          diff packages/redact/dist/redact.vendor.js apps/extension/vendor/redact.js

  # The web recorder end to end: one headless Chromium against a node:http
  # page fixture + vitrinka stub (packages/web/e2e). Its own job so the unit
  # suite above never waits on a browser download.
  e2e-web:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    runs-on: [self-hosted, vitrinka-kit-ci]
    steps:
      # The suite is one serial Chromium worker, so its time follows the core
      # it gets: print the CPU, the lane's quota and where /tmp lives (Chromium
      # keeps its shared memory there under --disable-dev-shm-usage).
      - name: Runner resources
        id: runner
        run: |
          echo "network=${CI_JIT_RUNNER_NETWORK:-host}" >> "$GITHUB_OUTPUT"
          grep -m1 'model name' /proc/cpuinfo || true
          echo "nproc=$(nproc) nproc_all=$(nproc --all) loadavg=$(cut -d' ' -f1-3 /proc/loadavg)"
          for counter in cpu.max memory.max; do
            if [ -r "/sys/fs/cgroup/$counter" ]; then echo "$counter=$(cat "/sys/fs/cgroup/$counter")"; fi
          done
          findmnt --target /tmp --noheadings --output TARGET,FSTYPE || true
      - name: GitHub results endpoint (bridge runner)
        if: steps.runner.outputs.network == 'bridge'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = process.env.ACTIONS_RESULTS_ORL
            if (!url) throw new Error('bridge runner: the patched runner exposed no ACTIONS_RESULTS_ORL')
            core.exportVariable('ACTIONS_RESULTS_URL', url)
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@vitrinka/redact' build && bun run --filter '@vitrinka/link' build
      # The lane image bakes Chromium's system libraries, and --with-deps would
      # apt-get them again on every job. The public lane keeps no cache, so
      # the browser itself downloads per job.
      - run: bunx playwright install chromium
      - run: bun run test:e2e:web
      # What the suite cost the lane: cgroup CPU time and quota throttling,
      # memory peak and the guest's load once it ran.
      - name: Runner usage
        if: always()
        run: |
          echo "loadavg=$(cut -d' ' -f1-3 /proc/loadavg)"
          for counter in cpu.stat memory.peak; do
            if [ -r "/sys/fs/cgroup/$counter" ]; then echo "$counter:"; cat "/sys/fs/cgroup/$counter"; fi
          done
