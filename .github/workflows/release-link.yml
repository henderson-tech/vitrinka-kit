name: Release @vitrinka/link

# A release is a tag, never a merge: `git tag link-vX.Y.Z && git push origin link-vX.Y.Z`.
# The tag version must equal packages/link/package.json's version.
# ORDER MATTERS: @vitrinka/expo depends on @vitrinka/link — publish this
# package BEFORE the first expo-v* tag that ships the dependency.

on:
  push:
    tags: ["link-v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag-reachability guard needs history
          persist-credentials: false # nothing after checkout needs git auth
      - name: Refuse tags not reachable from main (BEFORE any lifecycle script runs)
        run: |
          # A pushed tag can point at ANY commit; the version check alone would
          # let an unreviewed branch publish with NPM_TOKEN in scope. Only
          # commits that went through main's PR flow may publish.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at a commit not reachable from main — refusing to publish" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#link-v}"
          PKG_VERSION="$(node -p "require('./packages/link/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION != package.json $PKG_VERSION" >&2
            exit 1
          fi
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: Publish
        working-directory: packages/link
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
