name: Release @vitrinka/redact

# A release is a tag, never a merge: `git tag redact-vX.Y.Z && git push origin redact-vX.Y.Z`.
# The tag version must equal packages/redact/package.json's version.
# ORDER MATTERS: @vitrinka/expo depends on @vitrinka/redact — publish this
# package BEFORE the first expo-v* tag that ships the dependency.

on:
  push:
    tags: ["redact-v*"]

permissions:
  contents: read
  id-token: write # npm provenance + OIDC trusted publishing

# A tag push delivered twice queues behind itself; the repeat finds the
# version on npm and publishes nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag-reachability guard needs history
          persist-credentials: false # nothing after checkout needs git auth
      - uses: ./.github/actions/release-package
        with:
          package: redact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
