name: Release @vitrinka/web

# A release is a tag, never a merge: `git tag web-vX.Y.Z && git push origin web-vX.Y.Z`.
# The tag version must equal packages/web/package.json's version.

on:
  push:
    tags: ["web-v*"]

permissions:
  contents: read
  id-token: write # npm provenance + OIDC trusted publishing

# A tag push delivered twice queues behind itself; the repeat finds the
# version on npm and publishes nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag-reachability guard needs history
          persist-credentials: false # nothing after checkout needs git auth
      - uses: ./.github/actions/release-package
        with:
          package: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
