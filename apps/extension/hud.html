<!doctype html>
<!-- The recorder's composer sheet (recorder-iframe vt-2985). It lives in an
     extension-origin iframe, not in the page's shadow root, because a page's
     focus trap (Radix FocusScope and friends) yanks focus back the moment it
     leaves the dialog for another element of the SAME document — but stands
     down when focus moves to another document (relatedTarget is null). The
     content script owns placement, open/close and pick mode; this page owns
     the textarea, the draft, the destination and Send. -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin:0; background:transparent; }
    * { box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    svg { width:1em; height:1em; vertical-align:-.125em; }
    /* recorder-hud-subtle: the kit sheet's look. A frame cannot blur the page
       behind it, so the ink is near-opaque instead of glass. */
    .pop { width:288px; padding:12px; background:rgba(26,22,23,.94); border-radius:14px; color:#f4efea;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.11), 0 0 0 .5px rgba(0,0,0,.30), 0 10px 28px -10px rgba(0,0,0,.5); }
    .pop-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    label { display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:#f4efea; }
    label i { width:3px; height:11px; border-radius:1px; background:#ff3b57; }
    button { all:unset; cursor:pointer; }
    .closeb { width:24px; height:24px; border-radius:7px; color:rgba(244,239,234,.44); font-size:12px; text-align:center; line-height:24px; }
    .closeb:hover { color:#f4efea; background:rgba(255,255,255,.08); }
    button:focus-visible { outline:2px solid #ff3b57; outline-offset:2px; }
    textarea { width:100%; margin-top:10px; padding:9px 11px; min-height:64px; resize:vertical;
      background:rgba(0,0,0,.28); border:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.11); border-radius:9px; color:#f4efea;
      font:400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    textarea::placeholder { color:rgba(244,239,234,.44); }
    textarea:focus { outline:none; box-shadow:inset 0 0 0 1px rgba(244,239,234,.44); }
    .row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:10px; margin-top:10px; }
    .row.nodest { grid-template-columns:minmax(0,1fr) auto; }
    .ctx { font-size:11px; line-height:1.35; color:rgba(244,239,234,.44); text-align:center;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row.nodest .ctx { text-align:left; }
    .dest { display:none; padding:2px; border-radius:8px; background:rgba(0,0,0,.28); box-shadow:inset 0 0 0 1px rgba(255,255,255,.11); }
    .dest.show { display:inline-flex; }
    .dest button { padding:5px 8px; min-height:24px; box-sizing:border-box; border-radius:6px; color:rgba(244,239,234,.44);
      font-size:11.5px; font-weight:600; line-height:14px; }
    .dest button[aria-pressed="true"] { background:rgba(255,255,255,.08); color:#f4efea; }
    .sendb { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 12px; box-sizing:border-box; border-radius:8px;
      background:#ff3b57; color:#fff; font-size:12.5px; font-weight:600; line-height:1; }
    .sendb:hover { background:#ff5670; }
    .hints { margin-top:9px; font-size:11px; line-height:1; color:rgba(244,239,234,.44); }
  </style>
</head>
<body>
  <div class="pop" role="dialog" aria-labelledby="pop-title">
    <div class="pop-head">
      <label><i></i><span class="pop-title" id="pop-title">Note</span></label>
      <button class="closeb" aria-label="Close"></button>
    </div>
    <textarea placeholder="what's wrong / what to refine…"></textarea>
    <div class="row">
      <span class="dest" role="group" aria-label="Where this snap lands">
        <button class="d-board" aria-pressed="true">board</button>
        <button class="d-task" aria-pressed="false">task</button>
      </span>
      <span class="ctx"></span><button class="sendb"><span class="sendb-icon"></span><span>Send</span></button>
    </div>
    <div class="hints">↩ send · ⇧↩ newline · esc cancel</div>
  </div>
  <script src="vendor/vitrinka-icons.js"></script>
  <script src="hud.js"></script>
</body>
</html>
