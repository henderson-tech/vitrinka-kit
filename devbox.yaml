project: vitrinka-kit

apps:
  kit:
    cmd: "bun -e 'Bun.serve({hostname: \"0.0.0.0\", port: {port:web}, fetch: () => new Response(\"vitrinka-kit verification workspace\")})'"
    ports: [web]
    sync: .
    sync_ignores:
      - .env
      - .env.*
      - "!.env.example"
    deps:
      key: [bun.lock]
      cmd: "bun install --frozen-lockfile"

scripts:
  test:
    cmd: "bun run build && bun run typecheck && bun run test"
    up: false
    profile: small

resources:
  memory: 1G
  test: small
