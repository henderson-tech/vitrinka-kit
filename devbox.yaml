project: vitrinka-kit

resources:
  workspace: standard
  test: small
  memory: 2G

apps:
  kit:
    cmd: 'bun packages/web/e2e/fixture/serve.ts --host ${BIND_HOST:-127.0.0.1} --port {port:web}'
    ports: [web]
    sync: .
    sync_ignores: [".env", ".env.*", "!.env.example", "test-results", "playwright-report", ".vitrinka"]
    deps:
      key: [bun.lock, package.json, "packages/*/package.json"]
      cmd: bun install --frozen-lockfile

scripts:
  test:
    cmd: bun run build && bun run typecheck && bun run test
    up: false
  e2e:
    cmd: bun run test:e2e:web
    up: false
