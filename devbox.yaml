project: vitrinka-kit

system_packages:
  apt:
    - zip
    - unzip

apps:
  kit:
    cmd: "bun apps/extension/e2e/fixture.ts --port {port:web}"
    ports: [web]
    sync: .
    sync_ignores:
      - .env
      - .env.*
      - "!.env.example"
      - test-results
      - playwright-report
      - .vitrinka
    deps:
      key: [bun.lock, package.json, "packages/*/package.json"]
      cmd: "bun install --frozen-lockfile"

scripts:
  test:
    cmd: "bun run build && bun run typecheck && bun run test"
    up: false
    profile: small
  e2e:
    cmd: bun run test:e2e:web
    up: false

resources:
  workspace: standard
  memory: 2G
  test: small
